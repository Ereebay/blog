{{- $lang := cond (eq .Lang "en") "en" "zh-CN" -}}
<script>
  (function () {
    function siteTheme() {
      var saved = localStorage.getItem("pref-theme");
      if (saved) return saved;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.getElementById("giscus-script").setAttribute("data-theme", siteTheme());
    function pushToGiscus(t) {
      var iframe = document.querySelector("iframe.giscus-frame");
      if (iframe) {
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: t } } }, "https://giscus.app");
      }
    }
    new MutationObserver(function () {
      pushToGiscus(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>
<script id="giscus-script" src="https://giscus.app/client.js"
        data-repo="Ereebay/blog"
        data-repo-id="MDEwOlJlcG9zaXRvcnkxNzM1NTE2OTg="
        data-category="comments"
        data-category-id="DIC_kwDOClgwUs4DEE-N"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="light"
        data-lang="{{ $lang }}"
        crossorigin="anonymous"
        async>
</script>
