baseURL: https://blog.ereebay.me/

locale: zh-cn

title: eree's blog

copyright: © 2020-2026 eree's blog

pagination:
  pagerSize: 5

theme: hugo-PaperMod

defaultContentLanguage: zh-cn

languages:
  zh-cn:
    label: cn
    weight: 1
    menu:
      main:
        - identifier: tags
          name: 标签
          url: tags/
          weight: 10
        - identifier: archives
          name: 归档
          url: archives/
          weight: 20
        - identifier: search
          name: 搜索
          url: search/
          weight: 30
    params:
      homeInfoParams:
        Title: :) 你好
        Content: |
          这里是 **eree** 的 Log. [我](/pages/about)在这里记录了一些技术、生活、学习、娱乐的内容.
          这里有我的一些[朋友](/pages/links),还有我捕捉到的一些[瞬间](/pages/gallery),
          希望你能在这里找到你想要的东西。也希望你能在这里留下你的足迹.

  en:
    label: en
    weight: 2
    menu:
      main:
        - identifier: tags
          name: Tags
          url: tags/
          weight: 10
        - identifier: archives
          name: Archives
          url: archives/
          weight: 20
        - identifier: search
          name: Search
          url: search/
          weight: 30
    params:
      homeInfoParams:
        Title: Hello 👋
        Content: |
          This is `Eree`'s `Log`. [Me](/pages/about) here records some technology, life, study, and entertainment content.🤔
          I hope you can find what you want here. 👣

params:
  env: production

  defaultTheme: light
  ShowReadingTime: true
  ShowWordCount: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadcrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  Comments: false

  socialIcons:
    - name: email
      url: "mailto:xk.jackson@hotmail.com"
    - name: github
      url: "https://github.com/ereebay"
    - name: rss
      url: "index.xml"

  icp:
    enable: true
    icpurl: https://beian.miit.gov.cn/
    icpinfo: 浙ICP备15027223号-2

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 100
    threshold: 0.6
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    codeFences: true
    lineNos: false
