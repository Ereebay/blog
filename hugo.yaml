baseURL: https://blog.ereebay.me/

locale: zh-cn

title: eree's blog

copyright: © 2020-2026 eree's blog

pagination:
  pagerSize: 5

theme: hugo-theme-minima

defaultContentLanguage: zh-cn

languages:
  zh-cn:
    label: cn
    weight: 1
    params:
      greet: :) 你好
      author:
        status: ByteDancer.
        description: |
          这里是 [eree](https://blog.ereebay.me) 的 Log. [我](/pages/about)在这里记录了一些技术、生活、学习、娱乐的内容.
          这里有我的一些[朋友](/pages/links),还有我捕捉到的一些[瞬间](/pages/gallery),
          希望你能在这里找到你想要的东西。也希望你能在这里留下你的足迹.

  en:
    label: en
    weight: 2
    params:
      greet: Hello 👋
      author:
        status: ByteDancer 🎈
        description: |
          This is `Eree`'s `Log`. [Me](/pages/about) here records some technology, life, study, and entertainment content.🤔
          I hope you can find what you want here. 👣

params:
  greet: Hello :)

  subtitle: eree's blog

  switch: ["🌚", "🌝"]

  defaultTheme: light

  displayDate: true

  displayDescription: true

  selectable: true

  author:
    name: eree
    status: ByteDancer.
    description: |
      This is `Eree`'s `Log`. [Me](/pages/about) here records some technology, life, study, and entertainment content.🤔
      I hope you can find what you want here. 👣

  social:
    - name: "email"
      url: "mailto:xk.jackson@hotmail.com"
    - name: "github"
      url: "https://github.com/ereebay"
    - name: "rss"
      url: "index.xml"

  math:
    enable: true
    provider: katex

  diagram:
    enable: true
    provider: mermaid

  search:
    enable: true
    provider: fuse
    title: Search
    placeholder: Enter keywords

    fuse:
      keys:
        - title
        - permalink
        - summary
        - content
      distance: 100
      location: 0
      threshold: 0.6
      ignoreLocation: false
      isCaseSensitive: false
      includeScore: false
      includeMatches: false
      minMatchCharLength: 1
      shouldSort: true
      findAllMatches: false

  icp:
    enable: true
    icpurl: https://beian.miit.gov.cn/
    icpinfo: 浙ICP备15027223号-2

menu:
  main:
    - identifier: home
      name: Home
      weight: 1
    - identifier: tags
      name: Tags
      weight: 2
    - identifier: search
      name: 🔍
      weight: 3

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    lineNos: true
    noClasses: false
